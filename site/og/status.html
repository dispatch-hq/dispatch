<!doctype html>
<!--
  Source for site/public/og-status.png (the social preview for /status/).
  Re-render after editing, from the repo root, with any Chromium:

    chrome --headless --hide-scrollbars --window-size=1200,630 \
      --screenshot=site/public/og-status.png file:///ABSOLUTE/PATH/TO/site/og/status.html

  Fonts load from node_modules, so run `npm install` first.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2') format('woff2');
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 1000;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
        font-weight: 500;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        border-radius: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(640px 360px at 88% 0%, rgba(38, 46, 99, 0.75), transparent 70%),
          #151618;
        color: #eeeef2;
        font-family: 'DM Sans', sans-serif;
      }

      /* Blueprint grid, fading downwards. */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: linear-gradient(to bottom, #000 25%, transparent 95%);
      }

      .brand {
        position: absolute;
        top: 48px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 14px;
        font: 500 44px 'Fraunces', serif;
        letter-spacing: -0.01em;
      }

      .brand img {
        width: 40px;
        height: 44px;
      }

      .brand .section {
        color: #8b8d97;
        font-weight: 400;
      }

      h1 {
        position: absolute;
        left: 72px;
        top: 176px;
        width: 1056px;
        font: 400 112px/0.98 'Fraunces', serif;
        letter-spacing: -0.035em;
      }

      h1 em {
        font-style: italic;
        font-weight: 300;
        color: #8497fa;
      }

    </style>
  </head>
  <body>
    <div class="brand"><img src="../public/logo.svg" alt="" />Dispatch<span class="section">/ Status</span></div>
    <h1>Always on,<br /><em>by design.</em></h1>

  </body>
</html>
