<!doctype html>
<!--
  Source for site/public/og-status.png (the social preview for /status/).
  The background is the home hero's halo shader, drawn once by halo.js.
  Re-render after editing, from the repo root, with any Chromium that has WebGL:

    chrome --headless --hide-scrollbars --window-size=1200,630 \
      --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
      --screenshot=site/public/og-status.png file:///ABSOLUTE/PATH/TO/site/og/status.html

  Fonts load from node_modules, so run `npm install` first.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2') format('woff2');
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 1000;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        border-radius: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #151618;
        color: #eeeef2;
        font-family: 'DM Sans', sans-serif;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
      }

      .brand {
        position: absolute;
        top: 48px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font: 500 40px 'Fraunces', serif;
        letter-spacing: -0.01em;
      }

      .brand img {
        width: 36px;
        height: 40px;
      }

      .brand .section {
        color: #a4a7b3;
        font: 500 28px 'DM Sans', sans-serif;
        letter-spacing: -0.005em;
      }

      h1 {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-46%);
        text-align: center;
        font: 400 112px/1 'Fraunces', serif;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }

      h1 em {
        font-style: italic;
        font-weight: 300;
        color: #8497fa;
      }
    </style>
  </head>
  <body>
    <canvas id="halo" width="1200" height="630" data-t="108"></canvas>
    <div class="brand"><img src="../public/logo.svg" alt="" />Dispatch<span class="section">/ Status</span></div>
    <h1>Always on,<br /><em>by design.</em></h1>
    <script src="halo.js"></script>
  </body>
</html>
