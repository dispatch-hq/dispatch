<!doctype html>
<!--
  Source for site/public/og.png (the social preview for the home page).
  The home hero's Horizon look: a lit arc, the page's headline and an object from the page rising out of it.
  No WebGL needed. Re-render after editing, from the repo root, with any Chromium:

    chrome --headless --hide-scrollbars --window-size=1200,630 \
      --screenshot=site/public/og.png file:///ABSOLUTE/PATH/TO/site/og/banner.html

  Fonts load from node_modules, so run `npm install` first.
-->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Fraunces';src:url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2') format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'DM Sans';src:url('../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2') format('woff2');font-weight:100 1000}
@font-face{font-family:'IBM Plex Mono';src:url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400}
*{box-sizing:border-box;margin:0;border-radius:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#0e0f12;color:#eeeef2;font-family:'DM Sans',sans-serif}
em{font-style:italic;font-weight:300;color:#8497fa}
.sky{position:absolute;inset:0;background:
 radial-gradient(ellipse 34% 14% at 50% 70%,rgba(190,202,255,.34),transparent),
 radial-gradient(circle 1100px at 50% calc(70% + 1100px),#0a0b14 1010px,#161b3d 1092px,#dfe5ff 1099px,rgba(132,151,250,.62) 1103px,rgba(84,104,232,.26) 1154px,rgba(63,82,217,.1) 1270px,transparent 1480px)}
.brand{position:absolute;top:40px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;font:500 36px 'Fraunces';letter-spacing:-.01em}
.brand img{width:32px;height:36px}
.brand .sec{color:#a4a7b3;font:500 26px 'DM Sans'}
h1{position:absolute;top:112px;left:0;right:0;text-align:center;font:400 80px/1 'Fraunces';letter-spacing:-.03em}
.card{position:absolute;left:210px;right:210px;top:360px;bottom:-2px;background:#17181c;border:1px solid #3a3f5c}
.bar{display:flex;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid #2a2c32;font:400 13px 'IBM Plex Mono';color:#9b9da8}
.bar b{color:#eeeef2;font-weight:500}.bar span{margin-left:auto;color:#8497fa}
.mono{font:400 13px 'IBM Plex Mono'}.mut{color:#9b9da8}.br{color:#8497fa}
.row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid #26282e;font-size:18px}
.b{font:500 14px 'DM Sans';font-style:normal;padding:7px 16px;background:#2b2d33}.ok{background:#2f7d4f}.no{background:#b23a3f}</style></head><body>
<div class="sky"></div><div class="brand"><img src="../public/logo.svg">Dispatch</div>
<h1>Bug reports from Discord,<br><em>straight to GitHub.</em></h1>
<div class="card"><div class="bar"><img src="../public/logo.svg" width="14" height="16"><b>#triage</b><span>Report #142 · Awaiting review</span></div>
<h2 style="font:400 28px 'Fraunces';padding:16px 20px 6px">Launcher crashes when I change this setting</h2>
<small style="display:block;padding:0 20px 12px;color:#9b9da8;font-size:14px">from @BlackCat · Crash · 92% of reports accepted</small>
<div style="display:flex;gap:8px;padding:0 20px"><i class="b ok">Approve</i><i class="b no">Reject</i><i class="b">Request info</i><i class="b">Upvote · 6</i></div>
</div>
</body></html>
